<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Math Drill</title>
  <script>
    const params = new URLSearchParams(location.search);
    let lang = params.get('lang');
    if (lang !== 'en' && lang !== 'ja') {
      try { lang = localStorage.getItem('japanese-math-drill:lang'); } catch { /* storage blocked */ }
    }
    params.delete('lang');
    location.replace(`${lang === 'ja' ? 'ja/' : 'en/'}${String(params) ? `?${params}` : ''}${location.hash}`);
  </script>
</head>
<body>
  <p><a href="en/">English</a> · <a href="ja/" lang="ja">日本語</a></p>
</body>
</html>
